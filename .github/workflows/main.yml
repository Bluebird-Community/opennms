        run: |
          echo "TARGET=stable" >> ${GITHUB_ENV}
      - name: Set package repository
        run: |
          echo "PKG_REPOSITORY=${TARGET:-develop}" >> ${GITHUB_ENV}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: core-pkgs
          path: target/artifacts/packages/core
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: minion-pkgs
          path: target/artifacts/packages/minion
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: sentinel-pkgs
          path: target/artifacts/packages/sentinel
      - name: Publish Debian packages to Cloudsmith
        shell: bash
        run: |
          export CLOUDSMITH_API_KEY=${{ secrets.CLOUDSMITH_API_KEY }}
          for deb in $(find target/artifacts/packages -name "*.deb" -type f); do
            cloudsmith push deb --republish bluebird/${{ env.PKG_REPOSITORY }}/any-distro/any-version ${deb};
          done;
      - name: Publish RPM packages to Cloudsmith
        shell: bash
        run: |
          export CLOUDSMITH_API_KEY=${{ secrets.CLOUDSMITH_API_KEY }}
          for rpm in $(find target/artifacts/packages -name "*.rpm" -type f); do
            cloudsmith push rpm --republish bluebird/${{ env.PKG_REPOSITORY }}/any-distro/any-version ${rpm};
          done;

  create-github-release:
    needs:
      - core-packages
      - minion-packages
      - sentinel-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # cosign keyless signing via GitHub OIDC
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-core
          path: opennms-full-assembly/target
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-minion
          path: opennms-assemblies/minion/target
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-sentinel
          path: opennms-assemblies/sentinel/target
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: core-pkgs
          path: target/artifacts/packages/core
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: minion-pkgs
          path: target/artifacts/packages/minion
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: sentinel-pkgs
          path: target/artifacts/packages/sentinel
      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp opennms-full-assembly/target/*.tar.gz \
             opennms-assemblies/minion/target/*.tar.gz \
             opennms-assemblies/sentinel/target/*.tar.gz \
             target/artifacts/packages/*/*.deb \
             target/artifacts/packages/*/*.rpm \
             release-artifacts/
      # Runs before the checksum step on purpose: the SBOM is a release asset, so it
      # has to appear in SHA256SUMS and therefore under the signature. Generating it
      # afterwards would ship it unverifiable.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: release-artifacts
          artifact-name: sbom-${{ github.ref_name }}.spdx.json
          output-file: release-artifacts/sbom-${{ github.ref_name }}.spdx.json
      - name: Checksum every release artifact
        run: |
          set -euo pipefail
          cd release-artifacts
          # `*` is expanded before the redirection creates SHA256SUMS, so the file
          # never checksums itself.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: Sign the checksums file (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature release-artifacts/SHA256SUMS.sig \
            --output-certificate release-artifacts/SHA256SUMS.pem \
            release-artifacts/SHA256SUMS
      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: 'release-artifacts/*.tar.gz,release-artifacts/*.deb,release-artifacts/*.rpm'
      - name: Release ${{ github.ref_name }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            release-artifacts/SHA256SUMS
            release-artifacts/SHA256SUMS.sig
            release-artifacts/SHA256SUMS.pem
            release-artifacts/sbom-${{ github.ref_name }}.spdx.json
            opennms-full-assembly/target/*.tar.gz
            opennms-assemblies/minion/target/*.tar.gz
            opennms-assemblies/sentinel/target/*.tar.gz
            target/artifacts/packages/core/*.deb
            target/artifacts/packages/core/*.rpm
            target/artifacts/packages/minion/*.deb
            target/artifacts/packages/minion/*.rpm
            target/artifacts/packages/sentinel/*.deb
            target/artifacts/packages/sentinel/*.rpm
