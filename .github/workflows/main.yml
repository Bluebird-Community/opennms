---
name: main
run-name: Build tarballs, oci and packages with test suites
on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches:
      - '*'
    tags:
      - 'v*'  # Only version tags like v1.0.0

permissions: write-all

# Cancel an in-progress run when a newer run for the same branch or PR is triggered, so superseded
# builds free their runners instead of sitting in the queue. github.ref is unique per branch
# (refs/heads/<branch>) and per PR (refs/pull/<n>/merge), so pushing again to the same branch/PR
# supersedes the older run. Release tag builds (refs/tags/v*) are exempt so they always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  decide-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full_build: ${{ steps.decide.outputs.full_build }}
      baseline_ref: ${{ steps.decide.outputs.baseline_ref }}
      trigger_reason: ${{ steps.decide.outputs.trigger_reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - name: Install pathspec
        run: pip install --quiet pathspec
      - name: Decide build scope
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REF_VAR: ${{ github.ref }}
        run: |
          set -e

          # Fail-open trap (design D8): any uncaught error -> full_build=true, exit 0.
          trap 'echo "decide-scope hit an error - defaulting to full build" >&2; \
                printf "full_build=true\nbaseline_ref=\ntrigger_reason=decide-scope-internal-failure\n" >> "$GITHUB_OUTPUT"; \
                echo "::warning title=decide-scope::internal failure - falling back to full build"; \
                exit 0' ERR

          # ---- Trip-wire list (design D3) ----
          export TRIP_WIRES='/pom.xml
          dependencies/**
          Makefile
          compile.pl
          assemble.pl
          tools/development/**
          .github/workflows/**
          .cicd-assets/**
          .mvn/**
          container/features/**
          pnpm-lock.yaml
          ui/pnpm-lock.yaml'

          FULL_BUILD=false
          BASELINE_REF=""
          TRIGGER_REASON=""

          # ---- Event-based baseline derivation (design D2) ----
          case "$EVENT_NAME" in
            pull_request)
              BASELINE_REF="origin/$BASE_REF"
              ;;
            push)
              if [[ "$GITHUB_REF_VAR" == refs/tags/v* ]]; then
                FULL_BUILD=true
                TRIGGER_REASON="tag-push"
              elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" || -z "$BEFORE_SHA" ]]; then
                FULL_BUILD=true
                TRIGGER_REASON="zero-sha-baseline"
              else
                BASELINE_REF="$BEFORE_SHA"
              fi
              ;;
            workflow_dispatch)
              FULL_BUILD=true
              TRIGGER_REASON="workflow-dispatch"
              ;;
            *)
              FULL_BUILD=true
              TRIGGER_REASON="unknown-event-$EVENT_NAME"
              ;;
          esac

          # ---- Verify baseline resolves to a commit ----
          if [[ "$FULL_BUILD" != "true" && -n "$BASELINE_REF" ]]; then
            if ! git rev-parse --verify "${BASELINE_REF}^{commit}" >/dev/null 2>&1; then
              FULL_BUILD=true
              TRIGGER_REASON="baseline-unresolvable"
            fi
          fi

          # ---- Compute changed files (scoped path only) ----
          if [[ "$FULL_BUILD" != "true" ]]; then
            CHANGED_FILES=$(git diff --name-only "${BASELINE_REF}...HEAD" || echo "")
            if [[ -z "$CHANGED_FILES" ]]; then
              FULL_BUILD=true
              TRIGGER_REASON="no-changed-files"
            fi
          fi

          # ---- Trip-wire match via pathspec (gitignore semantics; design D3) ----
          if [[ "$FULL_BUILD" != "true" ]]; then
            TRIPPED=$(printf '%s\n' "$CHANGED_FILES" | python3 -c '
          import os, sys, pathspec
          patterns = os.environ["TRIP_WIRES"].strip().splitlines()
          spec = pathspec.GitIgnoreSpec.from_lines(patterns)
          for line in sys.stdin:
              line = line.strip()
              if line and spec.match_file(line):
                  print(line)
                  break
          ')
            if [[ -n "$TRIPPED" ]]; then
              FULL_BUILD=true
              TRIGGER_REASON="trip-wire:$TRIPPED"
            fi
          fi

          # ---- [full-ci] escape hatch (design D9) ----
          if [[ "$FULL_BUILD" != "true" ]]; then
            case "$EVENT_NAME" in
              pull_request)
                COMMIT_MSGS=$(git log -1 --format=%B "$PR_HEAD_SHA" 2>/dev/null || true)
                ;;
              push)
                COMMIT_MSGS=$(git log --format=%B "${BEFORE_SHA}..${AFTER_SHA}" 2>/dev/null || true)
                ;;
              *)
                COMMIT_MSGS=$(git log -1 --format=%B HEAD 2>/dev/null || true)
                ;;
            esac
            if printf '%s' "$COMMIT_MSGS" | grep -F -q '[full-ci]'; then
              FULL_BUILD=true
              TRIGGER_REASON="full-ci-keyword"
            fi
          fi

          if [[ "$FULL_BUILD" != "true" && -z "$TRIGGER_REASON" ]]; then
            TRIGGER_REASON="scoped:$EVENT_NAME"
          fi

          # ---- Emit outputs ----
          {
            echo "full_build=$FULL_BUILD"
            echo "baseline_ref=$BASELINE_REF"
            echo "trigger_reason=$TRIGGER_REASON"
          } >> "$GITHUB_OUTPUT"

          # ---- Surface decision (task 3.7): step summary + notice + log ----
          {
            echo "## decide-scope"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| \`full_build\` | \`$FULL_BUILD\` |"
            echo "| \`baseline_ref\` | \`${BASELINE_REF:-<none>}\` |"
            echo "| \`trigger_reason\` | \`$TRIGGER_REASON\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=decide-scope::full_build=$FULL_BUILD baseline_ref=${BASELINE_REF:-<none>} trigger_reason=$TRIGGER_REASON"
          echo "decide-scope: full_build=$FULL_BUILD baseline_ref=${BASELINE_REF:-<none>} trigger_reason=$TRIGGER_REASON"

  build-with-smoke-test:
    if: "!contains(github.event.commits[0].message, '[skip build-with-smoke-test]')"
    needs:
      - decide-scope
    runs-on:
      group: Default
      labels:
        - self-hosted
        - Linux
        - X64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cleaning project for quick validation
        run: |
          make validate
      - name: Build Web UI with pnpm including tests
        run: |
          make compile-ui
      - name: Build and assemble from source without expensive tasks
        run: |
          make
      - name: Package reactor artifacts for the test jobs
        run: |
          make package-reactor-artifacts
      - name: Persist reactor artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: reactor-artifacts
          path: target/artifacts/reactor-m2.tar.gz
          # Only consumed by test jobs inside this same run.
          retention-days: 1
      - name: Run quick smoke test
        run: |
          make smoke
      - name: Publish Quick Smoke Test Report
        if: success() || failure()
        uses: scacap/action-surefire-report@3dacff26879cd2a7f2160d101254032a3707fe6f  # v1.12.0
        with:
          check_name: Quick Smoke Test Report
      - name: Collect build logs
        if: always()
        run: |
          make collect-testresults
      - name: Persist test results and logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: build-with-smoke-test-logs
          path: target/artifacts/mvn.*.log
      - name: Persist tarball Core
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: tarball-core
          path: opennms-full-assembly/target/opennms-full-assembly-*.tar.gz
      - name: Persist tarball Minion
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: tarball-minion
          path: opennms-assemblies/minion/target/org.opennms.assemblies.minion-*.tar.gz
      - name: Persist tarball Sentinel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: tarball-sentinel
          path: opennms-assemblies/sentinel/target/org.opennms.assemblies.sentinel-*.tar.gz

  core-packages:
    if: "!contains(github.event.commits[0].message, '[skip core-packages]')"
    needs:
      - integration-tests
      - e2e-tests-core
      - e2e-tests-minion
      - e2e-tests-sentinel
    runs-on: ubuntu-latest
    container:
      image: quay.io/bluebird/java-builder:ubuntu.0.2.0.jdk-21.b27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-core
          path: opennms-full-assembly/target
      - name: Install nfpm
        uses: ./.github/actions/setup-nfpm
      # One make invocation builds both formats, so the assembly is extracted once.
      # Two separate calls each re-ran core-pkg-buildroot.
      - name: Build Core Debian and RPM packages
        run: make core-pkgs PKG_RELEASE=${{ github.run_number }}
      - name: Persist Core package artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: core-pkgs
          path: |
            target/artifacts/packages/core

  minion-packages:
    if: "!contains(github.event.commits[0].message, '[skip minion-packages]')"
    needs:
      - integration-tests
      - e2e-tests-core
      - e2e-tests-minion
      - e2e-tests-sentinel
    runs-on: ubuntu-latest
    container:
      image: quay.io/bluebird/java-builder:ubuntu.0.2.0.jdk-21.b27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-minion
          path: opennms-assemblies/minion/target
      - name: Install nfpm
        uses: ./.github/actions/setup-nfpm
      # One make invocation builds both formats, so the assembly is extracted once.
      # Two separate calls each re-ran minion-pkg-buildroot.
      - name: Build Minion Debian and RPM packages
        run: make minion-pkgs PKG_RELEASE=${{ github.run_number }}
      - name: Persist Minion package artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: minion-pkgs
          path: |
            target/artifacts/packages/minion

  sentinel-packages:
    if: "!contains(github.event.commits[0].message, '[skip sentinel-packages]')"
    needs:
      - integration-tests
      - e2e-tests-core
      - e2e-tests-minion
      - e2e-tests-sentinel
    runs-on: ubuntu-latest
    container:
      image: quay.io/bluebird/java-builder:ubuntu.0.2.0.jdk-21.b27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-sentinel
          path: opennms-assemblies/sentinel/target
      - name: Install nfpm
        uses: ./.github/actions/setup-nfpm
      # One make invocation builds both formats, so the assembly is extracted once.
      # Two separate calls each re-ran sentinel-pkg-buildroot.
      - name: Build Sentinel Debian and RPM packages
        run: make sentinel-pkgs PKG_RELEASE=${{ github.run_number }}
      - name: Persist Sentinel package artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: sentinel-pkgs
          path: |
            target/artifacts/packages/sentinel

  core-oci:
    if: "!contains(github.event.commits[0].message, '[skip minion-oci]') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')"
    needs:
      - integration-tests
      - e2e-tests-core
      - e2e-tests-minion
      - e2e-tests-sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read       # checkout only; the registry uses QUAY_* secrets
      id-token: write      # cosign keyless signing via GitHub OIDC
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-core
          path: opennms-full-assembly/target
      - name: Extract Core tarball for container build
        run: |
          mkdir -p opennms-container/core/tarball-root
          tar xzf opennms-full-assembly/target/opennms-full-assembly-*-core.tar.gz -C opennms-container/core/tarball-root
          rm -rf opennms-full-assembly/target
      - name: Get the release version for the OCI tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TARGET=core" >> ${GITHUB_ENV}
          REF_NAME=${{ github.ref_name }}
          VERSION=${REF_NAME#v}  # Remove 'v' prefix
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Prepare
        run: |
          echo "OCI_REPOSITORY=${TARGET:-core-snapshot}" >> ${GITHUB_ENV}
          echo "SHORT_GIT_SHA=$(git rev-parse --short HEAD)" >> ${GITHUB_ENV}
          echo "GIT_SHA=$(git rev-parse HEAD)" >> ${GITHUB_ENV}
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ${GITHUB_ENV}
          echo "TAG=${VERSION:-$(git rev-parse --short HEAD)}" >> ${GITHUB_ENV}
      - name: Build and push Core container image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./opennms-container/core
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ env.TAG }}
            REVISION=${{ env.GIT_SHA }}
            SOURCE=https://github.com/Bluebird-Community/opennms/tree/${{ env.GIT_SHA }}/opennms-container/core
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_JOB_ID=${{ github.run_id }}
          tags: quay.io/bluebird/${{ env.OCI_REPOSITORY }}:${{ env.TAG }},quay.io/bluebird/${{ env.OCI_REPOSITORY }}:latest

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: Sign the released image (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "quay.io/bluebird/${OCI_REPOSITORY}@${DIGEST}"
      - name: Attest build provenance for the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-name: quay.io/bluebird/${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  minion-oci:
    if: "!contains(github.event.commits[0].message, '[skip minion-oci]') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')"
    needs:
      - integration-tests
      - e2e-tests-core
      - e2e-tests-minion
      - e2e-tests-sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read       # checkout only; the registry uses QUAY_* secrets
      id-token: write      # cosign keyless signing via GitHub OIDC
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-minion
          path: opennms-assemblies/minion/target
      - name: Extract Minion tarball for container build
        run: |
          mkdir -p opennms-container/minion/tarball-root
          tar xzf opennms-assemblies/minion/target/org.opennms.assemblies.minion-*-minion.tar.gz --strip-component 1 -C opennms-container/minion/tarball-root
      - name: Generate minion-config-schema
        working-directory: opennms-container/minion
        run: |
          cat minion-config-schema.yml.in | sed -e 's,@VERSION@,${{ github.sha }},' \
          -e 's,@REVISION@,${{ github.sha }},' \
          -e 's,@BRANCH@,${{ github.ref_name }},' \
          -e 's,@BUILD_NUMBER@,${{ github.run_id }},' > minion-config-schema.yml
      - name: Get the release version for the OCI tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TARGET=minion" >> ${GITHUB_ENV}
          REF_NAME=${{ github.ref_name }}
          VERSION=${REF_NAME#v}  # Remove 'v' prefix
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Prepare
        run: |
          echo "OCI_REPOSITORY=${TARGET:-minion-snapshot}" >> ${GITHUB_ENV}
          echo "SHORT_GIT_SHA=$(git rev-parse --short HEAD)" >> ${GITHUB_ENV}
          echo "GIT_SHA=$(git rev-parse HEAD)" >> ${GITHUB_ENV}
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ${GITHUB_ENV}
          echo "TAG=${VERSION:-$(git rev-parse --short HEAD)}" >> ${GITHUB_ENV}
      - name: Build and push Minion container image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./opennms-container/minion
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ env.TAG }}
            REVISION=${{ env.GIT_SHA }}
            SOURCE=https://github.com/Bluebird-Community/opennms/tree/${{ env.GIT_SHA }}/opennms-container/minion
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_JOB_ID=${{ github.run_id }}
          tags: quay.io/bluebird/${{ env.OCI_REPOSITORY }}:${{ env.TAG }},quay.io/bluebird/${{ env.OCI_REPOSITORY }}:latest

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: Sign the released image (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "quay.io/bluebird/${OCI_REPOSITORY}@${DIGEST}"
      - name: Attest build provenance for the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-name: quay.io/bluebird/${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  sentinel-oci:
    if: "!contains(github.event.commits[0].message, '[skip minion-oci]') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')"
    needs:
      - integration-tests
      - e2e-tests-core
      - e2e-tests-minion
      - e2e-tests-sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read       # checkout only; the registry uses QUAY_* secrets
      id-token: write      # cosign keyless signing via GitHub OIDC
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: tarball-sentinel
          path: opennms-assemblies/sentinel/target
      - name: Extract Sentinel tarball for container build
        run: |
          mkdir -p opennms-container/sentinel/tarball-root
          tar xzf opennms-assemblies/sentinel/target/org.opennms.assemblies.sentinel-*-sentinel.tar.gz --strip-component 1 -C opennms-container/sentinel/tarball-root
      - name: Get the release version for the OCI tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TARGET=sentinel" >> ${GITHUB_ENV}
          REF_NAME=${{ github.ref_name }}
          VERSION=${REF_NAME#v}  # Remove 'v' prefix
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Prepare
        run: |
          echo "OCI_REPOSITORY=${TARGET:-sentinel-snapshot}" >> ${GITHUB_ENV}
          echo "SHORT_GIT_SHA=$(git rev-parse --short HEAD)" >> ${GITHUB_ENV}
          echo "GIT_SHA=$(git rev-parse HEAD)" >> ${GITHUB_ENV}
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ${GITHUB_ENV}
          echo "TAG=${VERSION:-$(git rev-parse --short HEAD)}" >> ${GITHUB_ENV}
      - name: Build and push Sentinel container image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./opennms-container/sentinel
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ env.TAG }}
            REVISION=${{ env.GIT_SHA }}
            SOURCE=https://github.com/Bluebird-Community/opennms/tree/${{ env.GIT_SHA }}/opennms-container/sentinel
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            BUILD_JOB_ID=${{ github.run_id }}
          tags: quay.io/bluebird/${{ env.OCI_REPOSITORY }}:${{ env.TAG }},quay.io/bluebird/${{ env.OCI_REPOSITORY }}:latest

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: Sign the released image (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "quay.io/bluebird/${OCI_REPOSITORY}@${DIGEST}"
      - name: Attest build provenance for the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-name: quay.io/bluebird/${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  unit-tests:
    if: "!contains(github.event.commits[0].message, '[skip unit-tests]')"
    needs:
      - decide-scope
      - build-with-smoke-test
    strategy:
      fail-fast: false
      matrix:
        shard_idx: [ 0, 1, 2 ] # Test job index for each runner
        shards: [ 3 ]          # 3 parallel test jobs
    # Self-hosted on purpose, unlike integration-tests below.
    #
    # These three shards are only ~26 min of test time, the smallest slice of the suite,
    # but they gate integration-tests and every e2e job. Moving them to 4 vCPU runners
    # exposed a string of latent hardware assumptions in the unit suite -- an off-heap
    # queue deadlock (fixed), a suspected message-loss window (issue #204) and a Drools
    # test that races a streaming rule engine -- and each one blocked the whole pipeline
    # from validating anything downstream. Keeping the gate on the fast machines and
    # sending the eight integration shards to GitHub-hosted runners instead puts the
    # capacity where the time actually is (~5 h vs ~26 min) without a red gate.
    #
    # No pnpm, jrrd2 or dependency-cache setup here: the self-hosted runners already
    # provide pnpm and jrrd2, and their ~/.m2 persists between jobs, so restoring a
    # 1.1 GB third-party cache over an already-warm repository would cost time rather
    # than save it. The jrrd2 action in particular apt-installs and writes to /usr/lib,
    # which must not run against a persistent host.
    runs-on:
      group: Default
      labels:
        - self-hosted
        - Linux
        - X64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # find-tests.py needs the baseline_ref commit locally to diff against HEAD
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch the reactor artifacts built by build-with-smoke-test
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: reactor-artifacts
          path: target/artifacts
      - name: Restore the reactor artifacts into the local Maven repository
        run: |
          make restore-reactor-artifacts
      - name: Clean stale test reports (self-hosted runner defensive)
        run: |
          find . -path ./.git -prune -o -type d \( -name surefire-reports -o -name failsafe-reports \) -exec rm -rf {} + 2>/dev/null || true
      - name: Run unit test suite (shard ${{ matrix.shard_idx }})
        env:
          BASELINE_REF: ${{ needs.decide-scope.outputs.baseline_ref }}
          FULL_BUILD: ${{ needs.decide-scope.outputs.full_build }}
        run: |
          make unit-tests MAVEN_SHARD_IDX=${{ matrix.shard_idx }} MAVEN_SHARDS=${{ matrix.shards }}
      - name: Publish Unit Test Report (shard ${{ matrix.shard_idx }})
        if: success() || failure()
        uses: scacap/action-surefire-report@3dacff26879cd2a7f2160d101254032a3707fe6f  # v1.12.0
        with:
          check_name: Unit Test Report (shard ${{ matrix.shard_idx }})
      - name: Collect test results and logs (shard ${{ matrix.shard_idx }})
        if: always()
        run: |
          make collect-testresults
      - name: Persist unit test results (shard ${{ matrix.shard_idx }})
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: unit-tests-artifacts-${{ matrix.shard_idx }}
          path: |
            target/artifacts/mvn.*.log
            target/artifacts/surefire-reports
            target/artifacts/failsafe-reports

  integration-tests:
    if: "!contains(github.event.commits[0].message, '[skip integration-tests]')"
    strategy:
      fail-fast: false
      matrix:
        shard_idx: [ 0, 1, 2, 3, 4, 5, 6, 7 ] # Test job index for each runner
        shards: [ 8 ]                         # total number of parallel test jobs
    needs:
      - decide-scope
      # Explicit: this job restores the reactor and assembly artifacts it publishes.
      - build-with-smoke-test
      - unit-tests
    # GitHub-hosted, see the note on unit-tests. PostgreSQL comes from
    # .cicd-assets/postgres/compose.yaml via 'make spinup-postgres'; Docker and Compose
    # are both present on ubuntu-latest and the compose file binds no host paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # find-tests.py needs the baseline_ref commit locally to diff against HEAD
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      # See the note on unit-tests: deps-build requires pnpm on PATH.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.33.0
      - name: Set up jrrd2
        uses: ./.github/actions/setup-jrrd2
      # Many integration tests load a Spring context containing the 'pinger' bean.
      # NativeDatagramSocket.create tries an unprivileged ICMP datagram socket first and
      # only falls back to SOCK_RAW, and DaoTestConfigBean pins the JNA pinger for tests.
      # Ubuntu ships net.ipv4.ping_group_range as "1 0", which allows no group, so the
      # SOCK_DGRAM attempt fails with EPERM, the SOCK_RAW fallback fails without
      # CAP_NET_RAW, and every such context fails to load. Widening the range is what the
      # product's own bin/ensure-user-ping.sh does for non-root installs, and it avoids
      # granting capabilities to the JVM. unit-tests does not need this -- the full unit
      # suite passes without it -- so it is deliberately only set here.
      - name: Allow unprivileged ICMP ping sockets
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Cache third-party Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # See the note on unit-tests: org/opennms is excluded so the reactor handoff
          # remains the only source of this commit's own artifacts.
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/opennms
          key: m2-thirdparty-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-thirdparty-
      - name: Fetch the reactor artifacts built by build-with-smoke-test
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: reactor-artifacts
          path: target/artifacts
      - name: Restore the reactor artifacts into the local Maven repository
        run: |
          make restore-reactor-artifacts
      # The unpack-core step that used to sit here is gone with the in-job build: it
      # extracted the 2.1G root assembly to /opt/opennms, and nothing on the integration
      # test path reads that location. The integration tests run inside the reactor with
      # opennms.home pointed at per-test directories.
      - name: Clean stale test reports (self-hosted runner defensive)
        run: |
          find . -path ./.git -prune -o -type d \( -name surefire-reports -o -name failsafe-reports \) -exec rm -rf {} + 2>/dev/null || true
      - name: Run integration unit test suite (shard ${{ matrix.shard_idx }})
        env:
          BASELINE_REF: ${{ needs.decide-scope.outputs.baseline_ref }}
          FULL_BUILD: ${{ needs.decide-scope.outputs.full_build }}
        run: |
          # See the note on unit-tests: raise the open-file limit for deps-build.
          ulimit -n 20000
          make integration-tests MAVEN_SHARD_IDX=${{ matrix.shard_idx }} MAVEN_SHARDS=${{ matrix.shards }}
      - name: Publish Integration Test Report (shard ${{ matrix.shard_idx }})
        if: success() || failure()
        uses: scacap/action-surefire-report@3dacff26879cd2a7f2160d101254032a3707fe6f  # v1.12.0
        with:
          check_name: Integration Test Report (shard ${{ matrix.shard_idx }})
      - name: Collect test results and logs (shard ${{ matrix.shard_idx }})
        if: always()
        run: |
          make collect-testresults
      - name: Persist integration test results (shard ${{ matrix.shard_idx }})
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: integration-tests-artifacts-${{ matrix.shard_idx }}
          path: |
            target/artifacts/mvn.*.log
            target/artifacts/surefire-reports
            target/artifacts/failsafe-reports

